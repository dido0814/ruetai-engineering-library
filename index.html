<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>睿泰工程資料庫｜登入</title>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f2f5f8 0%,
          #e9eff4 100%
        );

      color: #192536;
    }

    .page {

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

    }

    .login-card {

      width: 100%;
      max-width: 440px;

      background: #ffffff;

      padding: 52px 44px;

      border-radius: 24px;

      border:
        1px solid #e1e6ec;

      box-shadow:
        0 22px 60px
        rgba(24, 59, 86, 0.10);

      text-align: center;

    }

    .logo {

      width: 72px;
      height: 72px;

      margin:
        0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #183b56,
          #245a7a
        );

      color: white;

      font-size: 25px;
      font-weight: 800;

    }

    h1 {

      margin: 0;

      font-size: 30px;

      letter-spacing: -1px;

    }

    .english {

      margin-top: 7px;

      color: #8a96a5;

      font-size: 13px;

    }

    .description {

      margin:
        28px 0 30px;

      color: #657386;

      font-size: 14px;

      line-height: 1.8;

    }

    #googleLoginButton {

      min-height: 44px;

      display: flex;
      justify-content: center;

    }

    .login-status {

      min-height: 24px;

      margin-top: 21px;

      color: #667385;

      font-size: 13px;

    }

    .login-status.error {
      color: #b42318;
    }

    .notice {

      margin-top: 28px;

      padding-top: 22px;

      border-top:
        1px solid #edf0f3;

      color: #9aa4b1;

      font-size: 11px;

      line-height: 1.7;

    }

  </style>

</head>


<body>

<div class="page">

  <div class="login-card">

    <div class="logo">
      RT
    </div>

    <h1>
      睿泰工程資料庫
    </h1>

    <div class="english">
      Engineering File Library
    </div>

    <div class="description">

      公司工程計算書表、設計規範及
      共用技術文件管理平台

    </div>

    <div id="googleLoginButton">
    </div>

    <div
      id="loginStatus"
      class="login-status">
    </div>

    <div class="notice">

      本系統僅供授權使用者使用<br>
      檔案存取權限依 Google Drive 設定為準

    </div>

  </div>

</div>


<script src="config.js"></script>
<script src="auth.js"></script>

</body>
</html>
